<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Quiz: Acids, Bases &amp; Salts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --primary:#4f46e5;
          --ok:#16a34a; --bad:#dc2626; --okbg:#dcfce7; --badbg:#fee2e2; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --text:#e5e7eb; --muted:#94a3b8; --primary:#818cf8;
            --okbg:#14532d; --badbg:#7f1d1d; --border:#334155; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
  .bar { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin:8px 0 16px; }
  .bar > div { height:100%; background:var(--primary); width:0; transition:width .3s; }
  .meta { color:var(--muted); font-size:.85rem; display:flex; justify-content:space-between; }
  .q { font-size:1.15rem; font-weight:600; margin:8px 0 14px; }
  .qimg { display:block; max-width:100%; margin:0 auto 14px; border-radius:8px; background:#fff; }
  .opt { display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; font:inherit; color:inherit;
         background:var(--card); border:2px solid var(--border); border-radius:8px; cursor:pointer; }
  .opt:hover:not(:disabled) { border-color:var(--primary); }
  .opt.correct { background:var(--okbg); border-color:var(--ok); }
  .opt.wrong { background:var(--badbg); border-color:var(--bad); }
  .opt:disabled { cursor:default; }
  .explain { margin-top:14px; padding:14px; border-left:4px solid var(--primary); background:var(--bg); border-radius:6px; }
  .explain h3 { margin:0 0 6px; font-size:1rem; }
  .chartbox { position:relative; height:240px; margin-top:12px; }
  button.primary { background:var(--primary); color:#fff; border:0; padding:10px 20px; border-radius:8px; font:inherit; cursor:pointer; margin-top:14px; }
  button.primary:disabled { opacity:.4; cursor:default; }
  .hidden { display:none; }
  .score { font-size:2.4rem; font-weight:700; text-align:center; }
  ul.review { padding-left:18px; }
</style>
</head>
<body>
<main>
  <h1>🧠 Science Quiz: Acids, Bases &amp; Salts</h1>

  <div id="quiz" class="card">
    <div class="meta"><span id="progressText"></span><span id="scoreText"></span></div>
    <div class="bar"><div id="progressBar"></div></div>
    <div id="question" class="q"></div>
    <div id="qimage"></div>
    <div id="options"></div>
    <div id="explain" class="explain hidden"></div>
    <button id="next" class="primary hidden">Next →</button>
  </div>

  <div id="results" class="card hidden">
    <div class="score" id="finalScore"></div>
    <p id="finalMsg" style="text-align:center;color:var(--muted)"></p>
    <div class="chartbox"><canvas id="resultChart"></canvas></div>
    <h3>Review</h3>
    <ul class="review" id="review"></ul>
    <button class="primary" id="restart">Practice again</button>
  </div>
</main>

<script>
// ---------- Question bank: edit/add your own ----------
// image: inline SVG string (or any URL). chart: optional Chart.js config shown in the explanation.
const QUESTIONS = [
  {
    text: "Why should curd and sour substances not be kept in brass and copper vessels?",
    options: [
      "They make the vessel shiny",
      "The acids in them react with the metal, forming harmful compounds and spoiling the food",
      "Brass and copper absorb the water",
      "Curd turns into a base in metal vessels"
    ],
    answer: 1,
    explanation: "Curd and sour foods contain acids. Acids react with metals such as copper and brass to form toxic metal salts, which make the food unsafe and corrode the vessel."
  },
  {
    text: "Which gas is usually liberated when an acid reacts with a metal?",
    options: ["Oxygen", "Carbon dioxide", "Hydrogen", "Nitrogen"],
    answer: 2,
    explanation: "Acid + Metal → Salt + Hydrogen gas. Example: Zn + H₂SO₄ → ZnSO₄ + H₂. Test: bring a burning candle near the gas — hydrogen burns with a 'pop' sound.",
    chart: {
      type: "bar",
      data: { labels: ["Acid + Metal", "Acid + Metal carbonate", "Acid + Base"],
              datasets: [{ label: "Product type (1 = gas H₂ / CO₂ released)", data: [1, 1, 0],
                           backgroundColor: ["#4f46e5", "#16a34a", "#f59e0b"] }] },
      options: { scales: { y: { max: 1, ticks: { stepSize: 1 } } } }
    }
  },
  {
    text: "Metal compound A reacts with dilute HCl to produce effervescence. The gas extinguishes a burning candle. If one of the compounds formed is calcium chloride, what is the balanced equation?",
    options: [
      "Ca + 2HCl → CaCl₂ + H₂",
      "CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂",
      "CaO + 2HCl → CaCl₂ + H₂O",
      "Ca(OH)₂ + 2HCl → CaCl₂ + 2H₂O"
    ],
    answer: 1,
    explanation: "A gas that extinguishes a burning candle is CO₂ (H₂ would burn with a pop). So A is calcium carbonate: CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂. Atoms: Ca 1=1, C 1=1, O 3=3, H 2=2, Cl 2=2 ✔."
  },
  {
    text: "Activity 2.8 (Fig. 2.3): in which solutions will the bulb glow?",
    image: `<svg viewBox="0 0 300 200" width="320" role="img" aria-label="Circuit: battery, bulb and switch connected to two nails in a beaker of solution">
      <rect x="110" y="90" width="110" height="95" fill="none" stroke="#374151" stroke-width="3"/>
      <rect x="111" y="135" width="108" height="49" fill="#bae6fd"/>
      <rect x="140" y="150" width="50" height="34" fill="#9ca3af"/>
      <rect x="147" y="100" width="5" height="60" fill="#6b7280"/><rect x="178" y="100" width="5" height="60" fill="#6b7280"/>
      <polyline points="149,100 149,30 40,30 40,45" fill="none" stroke="#111" stroke-width="2"/>
      <polyline points="181,100 181,30 250,30 250,55" fill="none" stroke="#111" stroke-width="2"/>
      <rect x="25" y="45" width="30" height="16" fill="#fde68a" stroke="#111"/><text x="40" y="57" font-size="9" text-anchor="middle">6 V</text>
      <circle cx="250" cy="68" r="12" fill="#fef9c3" stroke="#111"/><text x="272" y="72" font-size="10">Bulb</text>
      <text x="200" y="22" font-size="10">Switch</text>
      <text x="115" y="125" font-size="10" fill="#0c4a6e">Solution</text>
      <text x="150" y="196" font-size="9" fill="#111">Rubber cork</text></svg>`,
    options: [
      "Glucose and alcohol only",
      "HCl and H₂SO₄ only",
      "All four solutions",
      "None of them"
    ],
    answer: 1,
    explanation: "Acids such as HCl and H₂SO₄ ionise in water to give H⁺ ions, so the solution conducts electricity and the bulb glows. Glucose and alcohol contain hydrogen but do not form H⁺ ions, so the bulb stays off. Hence, hydrogen-containing ≠ acidic.",
    chart: {
      type: "bar",
      data: { labels: ["HCl", "H₂SO₄", "Glucose", "Alcohol"],
              datasets: [{ label: "Bulb brightness (illustrative)", data: [9, 9, 0, 0],
                           backgroundColor: ["#16a34a", "#16a34a", "#dc2626", "#dc2626"] }] }
    }
  },
  {
    text: "Carbon dioxide reacts with calcium hydroxide (lime water) to give a salt and water. What does this tell us about non-metallic oxides?",
    options: ["They are basic", "They are acidic", "They are neutral", "They are amphoteric"],
    answer: 1,
    explanation: "Ca(OH)₂ + CO₂ → CaCO₃ + H₂O. A base reacting with the oxide to give salt and water is just like a base reacting with an acid, so non-metallic oxides are acidic in nature."
  },
  {
    text: "Metallic oxides react with acids to give salts and water. Metallic oxides are therefore said to be…",
    options: ["Acidic oxides", "Basic oxides", "Neutral oxides", "Indicators"],
    answer: 1,
    explanation: "Like a base reacting with an acid, e.g. CuO + 2HCl → CuCl₂ + H₂O. So metallic oxides are basic oxides.",
    chart: {
      type: "pie",
      data: { labels: ["Metallic oxides (basic)", "Non-metallic oxides (acidic)"],
              datasets: [{ data: [1, 1], backgroundColor: ["#4f46e5", "#f59e0b"] }] }
    }
  },
  {
    text: "What is common to all acids that gives them similar chemical properties?",
    options: ["Oxygen ions", "Hydrogen ions (H⁺)", "Chloride ions", "Hydroxide ions"],
    answer: 1,
    explanation: "All acids produce H⁺ ions in aqueous solution (and all bases produce OH⁻ ions). H⁺ is responsible for acidic properties such as reacting with metals to release hydrogen."
  },
  {
    text: "Which gas turns lime water milky?",
    options: ["Hydrogen", "Oxygen", "Carbon dioxide", "Nitrogen"],
    answer: 2,
    explanation: "CO₂ reacts with lime water: Ca(OH)₂ + CO₂ → CaCO₃ + H₂O. The insoluble white CaCO₃ makes the water milky. Passing excess CO₂ turns it clear again as soluble calcium hydrogencarbonate forms."
  },
  {
    text: "What are the products when a metal carbonate reacts with an acid?",
    options: [
      "Salt + hydrogen",
      "Salt + water",
      "Salt + water + carbon dioxide",
      "Base + carbon dioxide"
    ],
    answer: 2,
    explanation: "Metal carbonate + Acid → Salt + CO₂ + H₂O, e.g. Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂."
  },
  {
    text: "What is the general result of an acid reacting with a base?",
    options: [
      "Hydrogen gas is released",
      "Salt and water are formed (neutralisation)",
      "Only a salt is formed",
      "Carbon dioxide is released"
    ],
    answer: 1,
    explanation: "Base + Acid → Salt + Water, e.g. NaOH + HCl → NaCl + H₂O. The effect of the base is cancelled by the acid and vice versa, so this is called a neutralisation reaction."
  },
  {
    text: "What happens to blue litmus paper when dipped in an acid?",
    options: ["Stays blue", "Turns red", "Turns green", "Becomes colourless"],
    answer: 1,
    explanation: "Acids turn blue litmus red. Bases turn red litmus blue. Litmus is a natural indicator extracted from lichen."
  },
  {
    text: "Look at the pH scale below. Which solution is most likely a strong base?",
    image: `<svg viewBox="0 0 330 70" width="340" role="img" aria-label="pH scale 0 to 14 from red to blue">
      <defs><linearGradient id="ph" x1="0" x2="1">
        <stop offset="0" stop-color="#ef4444"/><stop offset=".25" stop-color="#f59e0b"/>
        <stop offset=".5" stop-color="#22c55e"/><stop offset=".75" stop-color="#3b82f6"/><stop offset="1" stop-color="#6d28d9"/>
      </linearGradient></defs>
      <rect x="10" y="10" width="310" height="26" fill="url(#ph)" rx="4"/>
      <text x="10" y="56" font-size="11" fill="#111">0 acidic</text><text x="145" y="56" font-size="11" fill="#111">7 neutral</text><text x="255" y="56" font-size="11" fill="#111">14 basic</text></svg>`,
    options: ["Lemon juice, pH 2", "Pure water, pH 7", "Blood, pH 7.4", "Sodium hydroxide, pH 14"],
    answer: 3,
    explanation: "pH below 7 is acidic, 7 is neutral, above 7 is basic. The higher the pH, the stronger the base, so NaOH at pH 14 is a strong base.",
    chart: {
      type: "bar",
      data: { labels: ["Lemon juice", "Milk", "Pure water", "Baking soda", "NaOH"],
              datasets: [{ label: "Typical pH", data: [2, 6.5, 7, 8.3, 14],
                           backgroundColor: ["#ef4444", "#f59e0b", "#22c55e", "#3b82f6", "#6d28d9"] }] },
      options: { scales: { y: { min: 0, max: 14 } } }
    }
  },
  {
    text: "Which ion do all bases produce in aqueous solution?",
    options: ["H⁺", "Cl⁻", "OH⁻", "Na⁺"],
    answer: 2,
    explanation: "Bases release hydroxide ions (OH⁻) in water, just as acids release H⁺. A base that dissolves in water is called an alkali."
  },
  {
    text: "Why does a glucose solution NOT make the bulb glow in Activity 2.8, even though glucose contains hydrogen?",
    options: [
      "Glucose is too thick",
      "Glucose does not produce H⁺ ions in solution, so it does not conduct electricity",
      "Glucose is a strong acid",
      "The battery is too weak"
    ],
    answer: 1,
    explanation: "Containing hydrogen is not enough. A compound is acidic only if it releases H⁺ ions in water. Glucose and alcohol stay as molecules, so no ions carry the current."
  },
  {
    text: "Which reaction is used to test for hydrogen gas?",
    options: [
      "It turns lime water milky",
      "It relights a glowing splinter",
      "It burns with a pop sound near a burning candle",
      "It turns blue litmus red"
    ],
    answer: 2,
    explanation: "Hydrogen is combustible and burns with a characteristic 'pop' sound. CO₂ turns lime water milky and extinguishes the flame; oxygen relights a glowing splinter."
  },
  {
    text: "A solution turns phenolphthalein pink. The solution is…",
    options: ["Acidic", "Basic", "Neutral", "Cannot be said"],
    answer: 1,
    explanation: "Phenolphthalein is colourless in acidic and neutral solutions but turns pink in basic solutions. Methyl orange is the opposite choice: red in acids, yellow in bases."
  },
  {
    text: "Balance the equation: Zn + HCl → ZnCl₂ + H₂. How many HCl molecules are needed?",
    options: ["1", "2", "3", "4"],
    answer: 1,
    explanation: "Zn + 2HCl → ZnCl₂ + H₂. There are 2 Cl atoms and 2 H atoms on the right, so 2 HCl are needed on the left."
  }
];

// ---------- Quiz logic ----------
const $ = id => document.getElementById(id);
let idx, score, answers, chartInst, resultInst;

function start() {
  idx = 0; score = 0; answers = [];
  $("results").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  show();
}

function show() {
  const q = QUESTIONS[idx];
  $("progressText").textContent = `Question ${idx + 1} of ${QUESTIONS.length}`;
  $("scoreText").textContent = `Score: ${score}`;
  $("progressBar").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("question").textContent = q.text;
  $("qimage").innerHTML = q.image ? `<div class="qimg">${imgHtml(q.image)}</div>` : "";
  $("explain").classList.add("hidden");
  $("next").classList.add("hidden");
  $("next").textContent = idx === QUESTIONS.length - 1 ? "See results" : "Next →";
  const box = $("options"); box.innerHTML = "";
  q.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => choose(i);
    box.appendChild(b);
  });
}

function imgHtml(src) {
  return src.trim().startsWith("<svg") ? src : `<img class="qimg" src="${src}" alt="">`;
}

function choose(i) {
  const q = QUESTIONS[idx];
  const right = i === q.answer;
  if (right) score++;
  answers.push(right);
  [...$("options").children].forEach((b, n) => {
    b.disabled = true;
    if (n === q.answer) b.classList.add("correct");
    else if (n === i) b.classList.add("wrong");
  });
  $("scoreText").textContent = `Score: ${score}`;
  const ex = $("explain");
  ex.innerHTML = `<h3>${right ? "✅ Correct!" : "❌ Not quite."}</h3><div></div>` +
                 (q.chart ? `<div class="chartbox"><canvas id="expChart"></canvas></div>` : "");
  ex.firstElementChild.nextElementSibling.textContent = q.explanation;
  ex.classList.remove("hidden");
  if (chartInst) chartInst.destroy();
  if (q.chart && window.Chart) {
    const cfg = structuredClone(q.chart);
    cfg.options = { responsive: true, maintainAspectRatio: false, ...(cfg.options || {}) };
    chartInst = new Chart($("expChart"), cfg);
  }
  $("next").classList.remove("hidden");
}

$("next").onclick = () => {
  if (++idx < QUESTIONS.length) show(); else finish();
};

function finish() {
  $("quiz").classList.add("hidden");
  $("results").classList.remove("hidden");
  const pct = Math.round(score / QUESTIONS.length * 100);
  $("finalScore").textContent = `${score} / ${QUESTIONS.length} (${pct}%)`;
  $("finalMsg").textContent = pct >= 80 ? "Excellent work!" : pct >= 50 ? "Good effort — review and retry." : "Keep practicing!";
  $("review").innerHTML = QUESTIONS.map((q, i) =>
    `<li>${answers[i] ? "✅" : "❌"} ${q.text} <br><small style="color:var(--muted)">Answer: ${q.options[q.answer]}</small></li>`).join("");
  if (resultInst) resultInst.destroy();
  if (window.Chart) {
    resultInst = new Chart($("resultChart"), {
      type: "doughnut",
      data: { labels: ["Correct", "Incorrect"],
              datasets: [{ data: [score, QUESTIONS.length - score], backgroundColor: ["#16a34a", "#dc2626"] }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }
}

$("restart").onclick = start;
start();
</script>
</body>
</html>
